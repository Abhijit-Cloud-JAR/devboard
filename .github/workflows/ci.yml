# Goal - I have to build, lint, test the code for frontend and backend , 
# then push the changes to Dockerhub

name: CI

on:
    push:
        branches: [practice]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                # check-latest: false
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              run: npm install --legacy-peer-deps
              working-directory: frontend

            - name: Frontend Linter
              run: npm run lint
              working-directory: frontend

            - name: Frontend Test
              run: npm run test
              working-directory: frontend

            - name: Docker SetUp [Login]
              uses: docker/login-action@v4
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-frontend:latest


    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: '1.23'
                cache: true
                go-version-file: 'go.mod'
                cache-dependency-path: go.sum

            - name: Run Go Formmater
              run: go fmt
              working-directory: backend

            - name: Run Go vet
              run: go vet
              working-directory: backend

            - name: Docker SetUp [Login]
              uses: docker/login-action@v4
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-backend:latest


    