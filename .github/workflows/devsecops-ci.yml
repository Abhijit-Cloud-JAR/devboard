name: DevSecOps-CI

on:
    push:
        branches: [practice]

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yaml

    dependency-scan:
        uses: ./.github/workflows/dependency-scan.yml

    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    sonar-scan:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    code-tests:
        uses: ./.github/workflows/code-tests.yml
    
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality, code-tests, secret-scanning, dependency-scan, docker-checks, sonar-scan]
        secrets: inherit

#---------------------SAST Complete---------------------

    deploy:
        uses: ./.github/workflows/deploy.yml
        needs: [docker-push]
        secrets: inherit

    dast-scan:
        uses: ./.github/workflows/dast.yml
        needs: [deploy]
        secrets: inherit