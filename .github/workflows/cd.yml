# Goal :To deploy the images from CI steps, once CI workflow is succeeded
name: CD

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches:
            - practice

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Copy example env to .env
              run: cp .env.example .env

            - name: Docker SetUp [Login]
              uses: docker/login-action@v4
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Deploy the containers with Docker Container
              run: |
                docker compose pull
                docker compose up -d